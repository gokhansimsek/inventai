# Install once: uv run pre-commit install
# Run by hand:  uv run pre-commit run --all-files
# Hooks call tools through uv, so they use the versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check (lint + type annotations)
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: docstrings
        name: Google-style docstrings (Args/Returns types match annotations)
        entry: uv run python tools/check_docstrings.py
        language: system
        types: [python]
        files: ^(src|tools)/

      - id: mypy
        name: mypy (strict)
        entry: uv run mypy src tests tools
        language: system
        types: [python]
        pass_filenames: false

      - id: pyright
        name: pyright (Pylance errors, standard mode)
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
